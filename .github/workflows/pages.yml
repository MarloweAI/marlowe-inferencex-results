# The results site: tools/build_site.py writes the recipe pages and the static API files (latest data/inferencex/
# snapshot plus data/marlowe/ points) into the app's public folder, then the Next.js app in app/ exports the site,
# which is published to this repository's GitHub Pages site. It runs on changes to main, after each daily
# InferenceX snapshot (a push made with the workflow token does not trigger other workflows, so the snapshot's
# completion does), and on demand. A pull request builds the site without deploying; the build fails if a Marlowe
# point lacks its recipe or a published file carries a local path, node name or private IP address.

name: Pages

on:
  push:
    branches: [main]
    paths: ["app/**", "data/**", "recipes/**", "tools/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["app/**", "data/**", "recipes/**", "tools/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["InferenceX snapshot"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      # The site's URL path prefix (empty at a domain root, "/<repo>" for a project site).
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Recipes and data
        run: python3 tools/build_site.py --site-base "${{ steps.pages.outputs.base_path }}"
      - name: Install
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Export
        working-directory: app/packages/app
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bunx --bun next build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/packages/app/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
