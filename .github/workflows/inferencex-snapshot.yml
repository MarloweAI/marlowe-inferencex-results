# Once a day, snapshot the InferenceX public API responses the chart reads (tools/inferencex_snapshot.py) to
# data/inferencex/<UTC date>/ on main. The public API needs no credential. A directory is written only when the
# published rows changed since the latest snapshot, and a day's directory is never replaced. If InferenceX cannot be
# fetched, nothing is written and the run fails; the site keeps the last snapshot and shows its date. The Pages
# workflow runs when this one completes.

name: InferenceX snapshot

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inferencex-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write is for pushing the snapshot to main with this job's token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        run: python3 tools/inferencex_snapshot.py
      - name: Commit
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data/inferencex)" ]; then
            echo "no new snapshot"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inferencex
          git commit -m "Snapshot InferenceX published results $(date -u +%F)"
          git push origin HEAD:main
